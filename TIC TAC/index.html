<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Tic Tac JS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Creamos la cabecera donde se van a ver los dos jugadores y el mensaje del ganador -->
    <main>
        <header id="cabecera">
            <div class="jugadores jugadorActivado" id="jugadorX">X</div>
            <h3 id="tituloCabecera">Elegir</h3>
            <div class="jugadores" id="jugadorO">O</div>
        </header>

    <!-- Creamos las celdas donde se van a ir poniendo tanto la X como el O -->
    <div id="contenedor">
        <div class="celdas">0</div>
        <div class="celdas">1</div>
        <div class="celdas">2</div>
        <div class="celdas">3</div>
        <div class="celdas">4</div>
        <div class="celdas">5</div>
        <div class="celdas">6</div>
        <div class="celdas">7</div>
        <div class="celdas">8</div>
    </div>

    <!-- Creamos el boton que reseteara nuestro juego -->
    <button id="reiniciarBtn">REINICIAR</button>

    </main>

    <script src="script.js"></script>
</body>
</html>
